name: pages
# Manual only: automatic deploys use pages-mini.yml (self-hosted) while hosted runners are unavailable.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.14' }
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - run: bash scripts/build-site.sh
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: node scripts/site-check.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
